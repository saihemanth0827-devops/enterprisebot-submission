name: DevOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-scan:
    name: Validate Helm and build/scan image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: helm lint ./chart

      - name: Render Helm chart with default values
        run: helm template demo ./chart --namespace demo

      - name: Render Helm chart with required overrides
        run: |
          helm template demo ./chart \
            --namespace demo \
            --set replicaCount=3 \
            --set config.appName=override-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        run: docker build --pull -t enterprise-bot:ci ./service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-bot:ci
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
